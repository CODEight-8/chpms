name: Deploy staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging on self-hosted runner
    runs-on:
      - self-hosted
      - staging
      - chpms

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Create deployment env file
        shell: bash
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          APP_BIND_IP: ${{ secrets.APP_BIND_IP }}
          SYSTEM_MODE: ${{ secrets.SYSTEM_MODE }}
          SNAPSHOT_TIMESTAMP: ${{ secrets.SNAPSHOT_TIMESTAMP }}
          BACKUP_RETENTION_DAYS: ${{ secrets.BACKUP_RETENTION_DAYS }}
          BACKUP_RETENTION_WEEKS: ${{ secrets.BACKUP_RETENTION_WEEKS }}
        run: |
          write_env() {
            key="$1"
            value="$(printf '%s' "$2" | sed "s/'/\\\\'/g")"
            printf "%s='%s'\n" "$key" "$value" >> .env
          }

          : > .env
          write_env DB_PASSWORD "$DB_PASSWORD"
          write_env NEXTAUTH_SECRET "$NEXTAUTH_SECRET"
          write_env NEXTAUTH_URL "$NEXTAUTH_URL"
          write_env OWNER_EMAIL "$OWNER_EMAIL"
          write_env OWNER_PASSWORD "$OWNER_PASSWORD"
          write_env APP_BIND_IP "$APP_BIND_IP"
          write_env SYSTEM_MODE "$SYSTEM_MODE"
          write_env SNAPSHOT_TIMESTAMP "$SNAPSHOT_TIMESTAMP"
          write_env BACKUP_RETENTION_DAYS "$BACKUP_RETENTION_DAYS"
          write_env BACKUP_RETENTION_WEEKS "$BACKUP_RETENTION_WEEKS"
          chmod 600 .env

      - name: Validate Docker Compose configuration
        shell: bash
        run: sudo docker compose config --quiet

      - name: Clear Docker
        shell: bash
        run: sudo docker system prune -a -f --volumes

      - name: Build and restart staging containers
        shell: bash
        run: sudo docker compose up -d --build --remove-orphans

      - name: Show running containers
        shell: bash
        run: sudo docker compose ps
